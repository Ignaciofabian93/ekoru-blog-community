services:
  ekoru-blog-community:
    image: ekoru-blog-community:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: ekoru-blog-community
    env_file:
      - .env.prod
    ports:
      - '9104:9004'
    networks:
      - ekoru-network

networks:
  ekoru-network:
    external: true
